# Reviewed Kurdish (Sorani) Fallback Templates for SupportPipe
# Used when customer writes in Kurdish or when LLM candidate fails grounding/safety gates.

templates:
  failed_transfer: >
    سڵاو، داوای لێبوردن دەکەین بۆ کێشەی حەواڵەکەت. داواکارییەکەت بە بڕی {amount_iqd} بۆ ژمارەی {phone_number} تۆمارکرا، و تیمی حەواڵە بەدواداچوون بۆ ژمارەی پرۆسەکە {transaction_ref} دەکات و لە نزیکترین کاتدا وەڵامت دەداتەوە.

  wrong_recipient: >
    سڵاو، ئاگادارکردنەوەکەت بەهۆی ناردنی هەڵەی پارە بە بڕی {amount_iqd} بۆ ژمارەی {phone_number} گەیشت. تیمی ئۆپەراسیۆن بەدواداچوون بۆ ژمارەی جووڵەکە {transaction_ref} دەکات بۆ ئەوەی یارمەتیت بدات.

  login_problem: >
    سڵاو، تێگەیشتین لە کێشەکەت لە چوونەژوورەوە بۆ ئەپڵیکەیشنەکە. تیمی پشتگیری تەکنیکی پێداچوونەوە بە دۆخی هەژمارەکەت دەکات. تکایە دڵنیابە لە نوێکردنەوەی ئەپەکە و بەستنەوەی ئینتەرنێت.

  agent_dispute: >
    سڵاو، داوای لێبوردن دەکەین لە هەر مامەڵەیەکی ناڕەحەتکەر لەگەڵ بریکاردا. سکاڵاکەت تۆمارکرا و تیمی بەڕێوەبردنی بریکارەکان لێکۆڵینەوە لە ڕووداوەکە دەکات بۆ پاراستنی مافت.

  card_issue: >
    سڵاو، داوای لێبوردن دەکەین بۆ ئەو کێشەیەی لە کارتەکەتدا ڕوویداوە. تیمی کارتی بانکی پشکنین بۆ هۆکاری کێشەکە دەکات تاوەکو بە شێوەیەکی ئاسایی دەست بە بەکارهێنانی بکەیتەوە.

  balance_or_statement_inquiry: >
    سڵاو، پرسیارەکەت دەربارەی باڵانسی هەژمارەکەت پێگەیشت. تیمی خزمەتگوزاری بەشداربووان پێداچوونەوە بە جووڵەی پارەکانت دەکات و ڕوونکردنەوەت پێدەدات.

  bill_payment_failure: >
    سڵاو، داوای لێبوردن دەکەین لە دواکەوتنی باڵانس یان پسوولەکە. داواکارییەکەت بە بڕی {amount_iqd} دینار و ژمارەی پرۆسەی {transaction_ref} تۆمارکرا و بەدواداچوونی بۆ دەکرێت.

  account_blocked: >
    سڵاو، داواکارییەکەت دەربارەی سنووردارکردنی هەژمارەکەت پێگەیشت. تیمی دڵنیابوونەوە و پابەندبوون پێداچوونەوە بە هۆکارەکە دەکات و هەنگاوەکانی چاککردنەوەت بۆ دەنێرێت.

  kyc_document_issue: >
    سڵاو، دەربارەی بەڵگەنامەکانت، تیمی پشتڕاستکردنەوە پێداچوونەوە بە وێنەی ناسنامەکەت دەکات تاوەکو یارمەتیت بدات لە تەواوکردنی پرۆسەکە.

  fraud_report: >
    سڵاو، ڕاپۆرتەکەت بە بەرزترین ئاستی گرنگی وەرگیرا و ڕاستەوخۆ ئاڕاستەی تیمی دژە فێڵ و ساختەکاری کرا بۆ گرتنەبەری ڕێوشوێنی پاراستنی خێرا بۆ هەژمارەکەت.

  refund_status: >
    سڵاو، سەبارەت بە گەڕاندنەوەی پارەکەت بە ژمارەی پرۆسەی {transaction_ref}، تیمەکەمان بەدواداچوونی بۆ دەکات و لە کاتی گەیشتنی پارەکە ئاگادارت دەکەینەوە.

  app_bug: >
    سڵاو، سوپاس بۆ ئاگادارکردنەوەمان لەم هەڵە تەکنیکییە. تیمی پەرەپێدان ڕاپۆرتەکەی وەرگرت و کاری لەسەر دەکات لە نوێکارییەکانی داهاتوودا.

  general_inquiry: >
    سڵاو، خۆشحاڵین بە پەیوەندیکردنت بە خزمەتگوزاری بەشداربووان. تیمەکەمان ئامادەیە بۆ وەڵامدانەوەی هەموو پرسیارەکانت و پێشکەشکردنی هاوکاری پێویست.

  unclear_or_incomplete: >
    [تێبینی ناوخۆیی بۆ کارمەند]: پەیامەکە ناتەواوە یان ناڕوونە و پێویستی بە چاوپێکەوتن و پێداچوونەوەی ڕاستەوخۆ هەیە.
