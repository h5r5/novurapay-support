# Reviewed Iraqi Arabic Fallback Templates
# Used when LLM is unavailable or when drafted reply fails grounding/safety gates.

templates:
  failed_transfer: >
    أهلاً بك، نتأسف على الإزعاج بخصوص عملية التحويل. استلمنا طلبك بمبلغ {amount_iqd} دينار، وفريق التحويلات راح يتحقق من العملية برقم المرجع {transaction_ref} ويردلك خبر خلال وقت قصير.

  wrong_recipient: >
    أهلاً بك، استلمنا بلاغك بخصوص التحويل الخاطئ بمبلغ {amount_iqd} دينار. فريق العمليات راح يتواصل ويدقق برقم العملية {transaction_ref} حتى نساعدك بالإجراءات الممكنة بأسرع وقت.

  login_problem: >
    أهلاً بك، فهمنا مشكلتك بتسجيل الدخول إلى التطبيق. فريق الدعم التقني راح يراجع حالة حسابك. يرجى التأكد من تحديث التطبيق لأحدث نسخة واستقرار الاتصال بالإنترنت، وراح نتواصل وياك.

  agent_dispute: >
    أهلاً بك، نعتذر عن أي تجربة غير مريحة مع الوكيل. استلمنا شكواك وفريق إدارة شبكة الوكلاء راح يفتح تحقيق بالواقعة ويتخذ الإجراء المناسب لحفظ حقك.

  card_issue: >
    أهلاً بك، نأسف للمشكلة اللي واجهتك مع البطاقة. فريق البطاقات راح يفحص سبب الرفض أو العطل بالنظام البنكي حتى ترجع تستخدمها بشكل طبيعي.

  balance_or_statement_inquiry: >
    أهلاً بك، استلمنا استفسارك بخصوص رصيد المحفظة والعمليات. فريق خدمة العملاء راح يراجع كشف حسابك ويوضحلك أي حركة مالية بالتفصيل.

  bill_payment_failure: >
    أهلاً بك، نعتذر عن تأخر تسديد الفاتورة. تم تسجيل طلبك بمبلغ {amount_iqd} دينار ورقم العملية {transaction_ref}، وفريق الدفع راح يتابع الأمر مع مزود الخدمة مباشرة.

  account_blocked: >
    أهلاً بك، استلمنا طلبك بخصوص تقييد الحساب. فريق التوثيق والامتثال راح يدقق بالسبب ويرسل لك الخطوات اللازمة لفك الحظر وحماية أمان محفظتك.

  kyc_document_issue: >
    أهلاً بك، بخصوص توثيق المستمسكات، فريق التحقق راح يراجع صور الهوية المرفوعة ويتأكد من وضوح البيانات لمساعدتك بإكمال التوثيق بنجاح.

  fraud_report: >
    أهلاً بك، تم استلام بلاغك بأولوية قصوى وجاري تحويله لفريق مكافحة الاحتيال لاتخاذ التدابير الأمنية الفورية وتتبع الحركة لحماية حسابك.

  refund_status: >
    أهلاً بك، بخصوص متابعة الاسترجاع المالي برقم العملية {transaction_ref}، فريقنا يتابع الموضوع مع الجهة المعنية وراح يوصلك إشعار فور اكتمال الإيداع.

  app_bug: >
    أهلاً بك، شكراً لإبلاغنا بالعطل الفني. فريق التطوير التقني استلم التقرير وجاري فحصه لحل المشكلة بالتحديثات القادمة.

  general_inquiry: >
    أهلاً بك، يسعدنا تواصلك مع خدمة العملاء. فريقنا جاهز للإجابة عن كل استفساراتك وتقديم المساعدة اللي تحتاجها.

  unclear_or_incomplete: >
    [ملاحظة داخلية للموظف]: الرسالة غير مكتملة أو غامضة وتحتاج مراجعة مباشرة قبل إرسال أي رد للعميل.
