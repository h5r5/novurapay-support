# configs/eval_matrix.yaml
# Evaluation Matrix Configurations for SupportPipe (Phase 5 Block C4)
# Evaluated strictly on held-in datasets (data/splits/dev.jsonl).
# data/splits/test.jsonl is a burned diagnostic holdout and is strictly NEVER opened.

configs:
  - id: offline_rule_ml_insample
    name: "Offline Heuristics + ML Baseline (In-Sample)"
    provider: mock
    model_id: "offline_mock"
    isolated: true
    status: active
    temperature: 0.0
    prompt_id: "system_prompt_v1"
    notes: "IN-SAMPLE, not a performance number"
    description: "System 1 regex/keyword heuristics combined with offline ML baseline without cloud calls (IN-SAMPLE, not a performance number)"

  - id: offline_rule_ml_oof
    name: "Offline Heuristics + ML Baseline (Out-of-Fold)"
    provider: offline_rule_ml_oof
    model_id: "offline_mock_oof"
    isolated: true
    status: active
    temperature: 0.0
    prompt_id: "system_prompt_v1"
    description: "GroupKFold out-of-fold predictions with ML retrained inside each fold and unchanged deterministic rules"

  - id: flash_lite
    name: "Gemini Flash-Lite"
    provider: gemini_flash_lite
    model_id: "OWNER_CONFIRM"
    isolated: true
    status: active
    temperature: 0.0
    prompt_id: "system_prompt_v1"
    description: "Per-ticket classifier using Google Gemini Flash-Lite"

  - id: flash
    name: "Gemini Flash (Audits/Drafts)"
    provider: gemini_flash
    model_id: "gemini-2.5-flash"
    isolated: true
    status: excluded  # subset or excluded: OWNER_CONFIRM
    temperature: 0.0
    prompt_id: "system_audit_prompt_v1"
    description: "System 2 Auditor/Drafter role (Flash rpm=5, rpd=20); excluded from bulk classification"

  - id: groq
    name: "Groq Llama-3.3-70B"
    provider: groq
    model_id: "llama-3.3-70b-versatile"
    isolated: true
    status: active
    temperature: 0.0
    prompt_id: "system_prompt_v1"
    description: "High-capacity cloud classifier using Groq Llama-3.3-70B-Versatile"

  - id: local_llm
    name: "Local LLM Adapter"
    provider: local_llm
    model_id: "OWNER_CONFIRM"
    isolated: true
    status: disabled
    temperature: 0.0
    prompt_id: "system_prompt_v1"
    description: "OpenAI-compatible local endpoint classifier (disabled by default)"

  - id: hybrid
    name: "Tri-Engine Hybrid Architecture"
    provider: hybrid
    model_id: "hybrid_consensus"
    isolated: false
    status: active
    temperature: 0.0
    prompt_id: "system_prompt_v1"
    description: "Cascaded tiered waterfall with active learning discrepancy capture"
