# configs/offline_v2_candidates.yaml
# SupportPipe Offline V2 Candidate Configurations (Phase 9 Block O - Task O2)
# Evaluated strictly on data/splits/dev.jsonl using GroupKFold(n_splits=5) grouped by template_id.
# data/splits/test.jsonl is a burned diagnostic set and is NEVER accessed.
# Strict deterministic execution with fixed random seeds and zero network dependencies.

candidates:
  - id: cand_v2_1_norm_char_logreg
    name: Full Normalization + Subword Character N-Gram Logistic Regression
    family:
      - general_arabic_normalization
      - char_ngrams
      - logistic_regression
    description: "Full Arabic normalization (alef/ya/ta unification, repeated letter squeeze, diacritics, tatweel) + char_wb (3,5) + Logistic Regression (C=2.5)"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: char_wb
      ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: logistic_regression
      C: 2.5
      max_iter: 300
      random_state: 42

  - id: cand_v2_2_norm_word_char_union_logreg_balanced
    name: Full Normalization + Word-Char FeatureUnion Class-Balanced Logistic Regression
    family:
      - general_arabic_normalization
      - word_char_union
      - logistic_regression_balanced
    description: "Full Arabic normalization + FeatureUnion(word 1-2, char_wb 3-5) + class-balanced Logistic Regression (C=2.0)"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: union_word_char
      word_ngram_range: [1, 2]
      char_ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: logistic_regression
      C: 2.0
      class_weight: balanced
      max_iter: 300
      random_state: 42

  - id: cand_v2_3_norm_linear_svc_calibrated
    name: Full Normalization + Word-Char Union Calibrated LinearSVC
    family:
      - general_arabic_normalization
      - word_char_union
      - linear_svc
      - probability_calibration
    description: "Full Arabic normalization + FeatureUnion(word 1-2, char_wb 3-5) + Calibrated LinearSVC (C=1.0, cv=3)"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: union_word_char
      word_ngram_range: [1, 2]
      char_ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: linear_svc_calibrated
      C: 1.0
      max_iter: 2000
      calibration_cv: 3
      random_state: 42

  - id: cand_v2_4_norm_complement_nb_char
    name: Full Normalization + Subword Character Complement Naive Bayes
    family:
      - general_arabic_normalization
      - char_ngrams
      - complement_nb
    description: "Full Arabic normalization + char_wb (3,5) TF-IDF + Complement Naive Bayes (alpha=0.5)"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: char_wb
      ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: complement_nb
      alpha: 0.5
      norm: false

  - id: cand_v2_5_norm_sgd_logloss_balanced
    name: Full Normalization + Word-Char Union Balanced SGD Classifier
    family:
      - general_arabic_normalization
      - word_char_union
      - sgd_classifier
    description: "Full Arabic normalization + FeatureUnion(word 1-2, char_wb 3-5) + SGDClassifier (log_loss, class_weight='balanced')"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: union_word_char
      word_ngram_range: [1, 2]
      char_ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: sgd
      loss: log_loss
      penalty: l2
      alpha: 0.0001
      class_weight: balanced
      max_iter: 1000
      random_state: 42

  - id: cand_v2_6_norm_template_weighted_logreg
    name: Full Normalization + Template-Weighted Word-Char Logistic Regression
    family:
      - general_arabic_normalization
      - word_char_union
      - logistic_regression
      - template_balanced_training
    description: "Full Arabic normalization + FeatureUnion(word 1-2, char_wb 3-5) + Logistic Regression with 1/sqrt(family_size) sample weights"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: union_word_char
      word_ngram_range: [1, 2]
      char_ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: logistic_regression
      C: 2.5
      max_iter: 300
      random_state: 42
    training:
      sample_weight: template_sqrt_inverse

  - id: cand_v2_7_norm_template_weighted_char_logreg_balanced
    name: Full Normalization + Template-Weighted Balanced Character Logistic Regression
    family:
      - general_arabic_normalization
      - char_ngrams
      - logistic_regression_balanced
      - template_balanced_training
    description: "Full Arabic normalization + char_wb (3,5) + class-balanced Logistic Regression with 1/sqrt(family_size) sample weights"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: char_wb
      ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: logistic_regression
      C: 2.5
      class_weight: balanced
      max_iter: 300
      random_state: 42
    training:
      sample_weight: template_sqrt_inverse

  - id: cand_v2_8_norm_char_calibrated_logreg
    name: Full Normalization + Subword Character Calibrated Logistic Regression
    family:
      - general_arabic_normalization
      - char_ngrams
      - logistic_regression
      - probability_calibration
    description: "Full Arabic normalization + char_wb (3,5) + Calibrated Logistic Regression (cv=3)"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: char_wb
      ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: logistic_regression_calibrated
      C: 2.5
      calibration_cv: 3
      max_iter: 300
      random_state: 42

  - id: cand_v2_9_norm_dedup_union_logreg
    name: Full Normalization + Within-Template Deduplicated Logistic Regression
    family:
      - general_arabic_normalization
      - word_char_union
      - logistic_regression
      - template_balanced_training
    description: "Full Arabic normalization + FeatureUnion(word 1-2, char_wb 3-5) + Logistic Regression with within-template de-duplication"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: union_word_char
      word_ngram_range: [1, 2]
      char_ngram_range: [3, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: logistic_regression
      C: 2.5
      max_iter: 300
      random_state: 42
    training:
      deduplicate_within_template: true

  - id: cand_v2_10_norm_char_wide_linear_svc
    name: Full Normalization + Wide Subword Character Calibrated LinearSVC
    family:
      - general_arabic_normalization
      - char_ngrams
      - linear_svc
      - probability_calibration
    description: "Full Arabic normalization + wide char_wb (2,5) + Calibrated LinearSVC (C=0.8, cv=3)"
    normalization:
      unify_alef: true
      unify_ya: true
      unify_ta_marbuta: true
      strip_diacritics_tatweel: true
      squeeze_repeated_letters: true
      eastern_to_western_digits: true
      arabizi_digit_letters: true
    vectorizer:
      type: char_wb
      ngram_range: [2, 5]
      sublinear_tf: true
      min_df: 1
    classifier:
      type: linear_svc_calibrated
      C: 0.8
      max_iter: 2000
      calibration_cv: 3
      random_state: 42
