[project]
name = "supportpipe"
version = "0.1.0"
description = "Support Pipeline Automation for Iraqi Arabic tickets (Agentic AI Challenge Iraq - Topic 06)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0.2",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "click>=8.1.8",
    "python-dateutil>=2.9.0",
    "streamlit>=1.40.0",
    "google-genai>=1.0.0; extra == 'live'",
    "groq>=0.15.0; extra == 'live'",
]

[project.optional-dependencies]
live = [
    "google-genai>=1.0.0",
    "groq>=0.15.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
    "types-python-dateutil>=2.9.0",
]

[project.scripts]
supportpipe = "supportpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportpipe"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
